<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Camera Capture</title>
    <style>
        body { background-color: #000; color: red; font-family: monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        pre { font-size: 8px; line-height: 7px; letter-spacing: 2px; font-weight: bold; }
    </style>
    <!-- Подключаем библиотеку Socket.IO для фронтенда -->
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <h1>Test translation</h1>
    <pre id="ascii-stream">Подключение к сокету сервера...</pre>
    
    <div>
        <input type="color" id="colors" value="#ff0000">
        <span id="colorValue">#ff0000</span>
    </div>
    
    <video id="webcam" autoplay playsinline width="640" height="480" style="display: none;"></video>

    <script>
        const asciiBox = document.getElementById('ascii-stream');
        const colorInput = document.getElementById('colors');
        const colorValue = document.getElementById('colorValue');

        // 1. Управляем цветом текста
        colorInput.addEventListener('input', (event) => {
            const chosenColor = event.target.value;
            colorValue.textContent = chosenColor;
            document.body.style.color = chosenColor;
        });

        // 2. Инициализируем соединение веб-сокетов
        const socket = io();

        // Слушаем ответ от сервера с готовым ASCII кодом
        socket.on('ascii_response', function(data) {
            asciiBox.textContent = data.ascii;
        });

        // 3. Работа с веб-камерой
        const camera = document.getElementById("webcam");
        const canvas = document.createElement('canvas');
        canvas.width = 320;  
        canvas.height = 240;
        const context = canvas.getContext('2d');

        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then((stream) => {
                camera.srcObject = stream;
                camera.onloadedmetadata = () => {
                    // Каждые 70мс отправляем свежий кадр по сокету
                    setInterval(sendFrame, 70); 
                };
            })
            .catch((error) => {
                console.error("Ошибка камеры:", error);
                asciiBox.textContent = "Ошибка: Доступ к камере заблокирован.";
            });

        function sendFrame() {
            if (camera.paused || camera.ended) return;
            context.drawImage(camera, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.4); // Сжатие до 40% для супер-скорости
            
            //Отправляем напрямую в сокет-событие без HTTP запросов
            socket.emit('video_frame', dataUrl);
        }
    </script>
</body>
</html>
