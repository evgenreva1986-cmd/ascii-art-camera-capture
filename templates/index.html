<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Matrix Camera Capture</title>
    <style>
        body { background-color: #000; color: red; font-family: monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; user-select: none; }
        /* Тег pre сохраняет все пробелы и переносы, формируя текстовую картинку */
        pre { font-size: 8px; line-height: 7px; letter-spacing: 2px; font-weight: bold; text-align: center; }
        div { margin-top: 15px; display: flex; align-items: center; gap: 10px; }
    </style>
    
    <!-- Подключаем Socket.IO прямо с твоего собственного сервера, чтобы хостинг его не заблокировал -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h1>ASCII Matrix Stream</h1>
    <pre id="ascii-stream">Загрузка ASCII потока через сокеты...</pre>
    
    <div>
        <input type="color" id="colors" value="#ff0000">
        <span id="colorValue">#ff0000</span>
    </div>
    
    <!-- Скрываем оригинальное цветное видео, оставляя только ASCII-эффект -->
    <video id="webcam" autoplay playsinline width="640" height="480" style="display: none;"></video>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const asciiBox = document.getElementById('ascii-stream');
            const colorInput = document.getElementById('colors');
            const colorValue = document.getElementById('colorValue');

            // Управление цветом текста (интерфейс "Матрицы")
            colorInput.addEventListener('input', (event) => {
                const chosenColor = event.target.value;
                colorValue.textContent = chosenColor;
                document.body.style.color = chosenColor;
            });

            // Подключаемся к веб-сокету (io подтянется из локального скрипта выше)
            const socket = io();

            // Ловим готовый текстовый кадр от Flask и выводим на экран
            socket.on('ascii_response', function(data) {
                asciiBox.textContent = data.ascii;
            });

            // Инициализация захвата веб-камеры
            const camera = document.getElementById("webcam");
            const canvas = document.createElement('canvas');
            canvas.width = 320;  // Оптимальное разрешение для моментальной отправки по сети
            canvas.height = 240;
            const context = canvas.getContext('2d');

            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then((stream) => {
                    camera.srcObject = stream;
                    camera.onloadedmetadata = () => {
                        // Каждые 70 миллисекунд «нарезаем» видео на кадр и шлем серверу
                        setInterval(sendFrame, 70); 
                    };
                })
                .catch((error) => {
                    console.error("Ошибка камеры:", error);
                    asciiBox.textContent = "Ошибка: Доступ к камере заблокирован. Убедитесь, что сайт открыт по HTTPS протоколу!";
                });

            function sendFrame() {
                if (camera.paused || camera.ended) return;
                
                // Рисуем текущий кадр из скрытого видеоплеера на невидимый canvas
                context.drawImage(camera, 0, 0, canvas.width, canvas.height);
                
                // Кодируем в формат JPEG с качеством 40%, чтобы данные летели без задержек
                const dataUrl = canvas.toDataURL('image/jpeg', 0.4);
                
                // Пушим строку кадра прямо в сокет
                socket.emit('video_frame', dataUrl);
            }
        });
    </script>
</body>
</html>
