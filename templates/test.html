<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        body { background-color: #000; color: red; font-family: monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        pre { font-size: 8px; line-height: 7px; letter-spacing: 2px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Test translation</h1>
    <pre id="ascii-stream">Загрузка ASCII потока...</pre>
    
    <div>
        <input type="color" id="colors" value="#ff0000">
        <span id="colorValue">#ff0000</span>
    </div>

    <script>
        const colorInput = document.getElementById('colors');
        const colorValue = document.getElementById('colorValue');
        const asciiBox = document.getElementById('ascii-stream'); // вернули переменную, чтобы не было ошибки

        colorInput.addEventListener('input', (event) => 
        {
            const chosenColor = event.target.value;
            colorValue.textContent = chosenColor;
            
            // 1. Меняем цвет конкретно у ASCII-блока
            asciiBox.style.color = chosenColor;
            
            // 2. ИСПРАВЛЕНО: Меняем цвет текста для всего body
            document.body.style.color = chosenColor;
        });
    </script>
</body>
</html>
